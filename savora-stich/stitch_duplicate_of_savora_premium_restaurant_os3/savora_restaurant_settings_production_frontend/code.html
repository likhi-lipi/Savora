<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Savora Pro | Production Settings</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Scripts -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#386549",
                        "on-primary": "#ffffff",
                        "secondary": "#4f652d",
                        "background": "#f9faf5",
                        "surface": "#ffffff",
                        "surface-variant": "#f0f1ed",
                        "outline": "#717972",
                        "error": "#ba1a1a",
                        "forest-green": "#5F8D6E"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1rem", // 16px corner radii as requested
                        "full": "9999px"
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                        "geist": ["Geist", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
        .receipt-shadow {
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.1);
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-sans antialiased">
<div id="root"></div>
<script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // --- Mock Components for Shared Nav (Immutable) ---
        const SharedHeader = () => (
            <header className="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#ecefed] px-4 lg:px-10 py-3 bg-white sticky top-0 z-50">
                <div className="flex items-center gap-4 text-[#131614]">
                    <div className="size-4">
                        <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path></svg>
                    </div>
                    <h2 className="text-[#131614] text-lg font-bold leading-tight tracking-[-0.015em] font-geist">Savora Pro</h2>
                </div>
                <div className="hidden md:flex flex-1 justify-end gap-8">
                    <div className="flex items-center gap-9">
                        <a className="text-[#131614] text-sm font-medium leading-normal" href="#">Dashboard</a>
                        <a className="text-[#131614] text-sm font-medium leading-normal" href="#">Orders</a>
                        <a className="text-[#131614] text-sm font-medium leading-normal" href="#">Menu</a>
                        <a className="text-[#131614] text-sm font-medium leading-normal" href="#">Analytics</a>
                        <a className="text-[#131614] text-sm font-medium leading-normal border-b-2 border-primary" href="#">Settings</a>
                    </div>
                    <div className="flex gap-2">
                        <button className="flex cursor-pointer items-center justify-center rounded-lg h-10 bg-[#ecefed] px-2.5">
                            <span className="material-symbols-outlined text-[#131614]">notifications</span>
                        </button>
                        <button className="flex cursor-pointer items-center justify-center rounded-lg h-10 bg-[#ecefed] px-2.5">
                            <span className="material-symbols-outlined text-[#131614]">account_circle</span>
                        </button>
                    </div>
                </div>
            </header>
        );

        // --- UI Components ---
        const SettingsCard = ({ title, subtitle, children, icon }) => (
            <motion.div 
                initial={{ opacity: 0, y: 20 }}
                whileInView={{ opacity: 1, y: 0 }}
                viewport={{ once: true }}
                className="bg-white border border-outline-variant p-6 rounded-xl shadow-sm mb-6"
            >
                <div className="flex items-center gap-3 mb-6">
                    <div className="p-2 bg-primary/10 rounded-lg text-primary">
                        <span className="material-symbols-outlined">{icon}</span>
                    </div>
                    <div>
                        <h3 className="text-lg font-bold font-geist text-[#131614]">{title}</h3>
                        <p className="text-sm text-outline">{subtitle}</p>
                    </div>
                </div>
                <div className="space-y-4">
                    {children}
                </div>
            </motion.div>
        );

        const InputField = ({ label, value, onChange, placeholder, type = "text", error }) => (
            <div className="w-full">
                <label className="block text-sm font-medium text-[#131614] mb-1.5">{label}</label>
                <input 
                    type={type}
                    value={value}
                    onChange={(e) => onChange(e.target.value)}
                    placeholder={placeholder}
                    className={`w-full rounded-lg border ${error ? 'border-error' : 'border-[#d8deda]'} bg-[#f9fafa] px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none`}
                />
                {error && <p className="text-xs text-error mt-1">{error}</p>}
            </div>
        );

        const Toggle = ({ label, checked, onChange }) => (
            <div className="flex items-center justify-between py-2">
                <span className="text-sm font-medium text-[#131614]">{label}</span>
                <button 
                    onClick={() => onChange(!checked)}
                    className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${checked ? 'bg-primary' : 'bg-gray-300'}`}
                >
                    <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${checked ? 'translate-x-6' : 'translate-x-1'}`} />
                </button>
            </div>
        );

        // --- Main Application ---
        const App = () => {
            const [isSaving, setIsSaving] = useState(false);
            const [showToast, setShowToast] = useState(false);
            const [isDirty, setIsDirty] = useState(false);
            const [activeTab, setActiveTab] = useState('profile');

            const [settings, setSettings] = useState({
                profile: {
                    name: "Green Plate Bistro",
                    email: "contact@greenplate.com",
                    phone: "+1 234 567 8900",
                    gst: "22AAAAA0000A1Z5",
                    fssai: "10022022000012"
                },
                tax: {
                    vat: "5",
                    serviceCharge: "10",
                    currency: "USD ($)"
                },
                receipt: {
                    showLogo: true,
                    showQR: true,
                    footerText: "Thank you for dining with us!",
                    showTaxes: true
                },
                appearance: {
                    theme: "light",
                    primaryColor: "#5F8D6E"
                }
            });

            const updateSetting = (section, field, value) => {
                setSettings(prev => ({
                    ...prev,
                    [section]: { ...prev[section], [field]: value }
                }));
                setIsDirty(true);
            };

            const handleSave = () => {
                setIsSaving(true);
                // Simulate API call
                setTimeout(() => {
                    setIsSaving(false);
                    setIsDirty(false);
                    setShowToast(true);
                    setTimeout(() => setShowToast(false), 3000);
                }, 1500);
            };

            const handleDiscard = () => {
                // Logic to reset state
                setIsDirty(false);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <SharedHeader />
                    
                    <main className="flex-grow max-w-7xl mx-auto w-full px-4 lg:px-10 py-8 pb-32">
                        <div className="flex flex-col lg:flex-row gap-8">
                            
                            {/* Sidebar - Desktop Only Sticky */}
                            <aside className="w-full lg:w-64 shrink-0">
                                <div className="sticky top-24 space-y-1">
                                    {[
                                        { id: 'profile', icon: 'person', label: 'Profile' },
                                        { id: 'taxes', icon: 'percent', label: 'Taxes & Currency' },
                                        { id: 'receipt', icon: 'receipt_long', label: 'Receipt Config' },
                                        { id: 'appearance', icon: 'palette', label: 'Appearance' },
                                        { id: 'hardware', icon: 'print', label: 'Hardware' },
                                        { id: 'notifications', icon: 'notifications_active', label: 'Notifications' },
                                        { id: 'security', icon: 'lock', label: 'Security' },
                                        { id: 'danger', icon: 'warning', label: 'Danger Zone', danger: true },
                                    ].map((item) => (
                                        <button
                                            key={item.id}
                                            onClick={() => setActiveTab(item.id)}
                                            className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all ${
                                                activeTab === item.id 
                                                ? 'bg-primary/10 text-primary' 
                                                : item.danger ? 'text-error hover:bg-error/5' : 'text-outline hover:bg-gray-100'
                                            }`}
                                        >
                                            <span className={`material-symbols-outlined text-[20px] ${activeTab === item.id ? 'fill-icon' : ''}`}>
                                                {item.icon}
                                            </span>
                                            {item.label}
                                        </button>
                                    ))}
                                </div>
                            </aside>

                            {/* Content Area */}
                            <div className="flex-1 max-w-3xl space-y-6">
                                <header className="mb-8">
                                    <h1 className="text-3xl font-bold font-geist text-[#131614] tracking-tight">Restaurant Settings</h1>
                                    <div className="flex items-center gap-2 mt-2">
                                        <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse-soft"></div>
                                        <p className="text-sm text-outline">Real-time sync enabled</p>
                                    </div>
                                </header>

                                {/* Profile Section */}
                                <SettingsCard 
                                    title="Restaurant Profile" 
                                    subtitle="Basic information displayed on invoices and online"
                                    icon="store"
                                >
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <InputField 
                                            label="Restaurant Name" 
                                            value={settings.profile.name} 
                                            onChange={(v) => updateSetting('profile', 'name', v)}
                                        />
                                        <InputField 
                                            label="Contact Email" 
                                            value={settings.profile.email} 
                                            onChange={(v) => updateSetting('profile', 'email', v)}
                                        />
                                        <InputField 
                                            label="Phone Number" 
                                            value={settings.profile.phone} 
                                            onChange={(v) => updateSetting('profile', 'phone', v)}
                                        />
                                        <InputField 
                                            label="GSTIN" 
                                            value={settings.profile.gst} 
                                            onChange={(v) => updateSetting('profile', 'gst', v)}
                                        />
                                    </div>
                                    <InputField 
                                        label="FSSAI License" 
                                        value={settings.profile.fssai} 
                                        onChange={(v) => updateSetting('profile', 'fssai', v)}
                                    />
                                    <div className="mt-4">
                                        <p className="text-sm font-medium text-[#131614] mb-2">Location</p>
                                        <div className="h-40 rounded-xl overflow-hidden bg-gray-200 relative group">
                                            <div 
                                                className="w-full h-full bg-cover bg-center"
                                                style={{ backgroundImage: `url('placeholder')` }}
                                                data-alt="A clean, minimalist overhead satellite map of a modern metropolitan business district in a lush green city like Seattle or Singapore. Professional UI aesthetic with subtle green and gray tones."
                                            ></div>
                                            <div className="absolute inset-0 bg-black/10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button className="bg-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg flex items-center gap-2">
                                                    <span className="material-symbols-outlined">location_on</span>
                                                    Update Map Pin
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </SettingsCard>

                                {/* Taxes & Currency */}
                                <SettingsCard 
                                    title="Taxes & Currency" 
                                    subtitle="Manage financial compliance and display currency"
                                    icon="payments"
                                >
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <InputField 
                                            label="Default VAT (%)" 
                                            value={settings.tax.vat} 
                                            onChange={(v) => updateSetting('tax', 'vat', v)}
                                        />
                                        <InputField 
                                            label="Service Charge (%)" 
                                            value={settings.tax.serviceCharge} 
                                            onChange={(v) => updateSetting('tax', 'serviceCharge', v)}
                                        />
                                        <div className="w-full">
                                            <label className="block text-sm font-medium text-[#131614] mb-1.5">Currency</label>
                                            <select 
                                                className="w-full rounded-lg border border-[#d8deda] bg-[#f9fafa] px-4 py-3 text-sm focus:border-primary transition-all outline-none"
                                                value={settings.tax.currency}
                                                onChange={(e) => updateSetting('tax', 'currency', e.target.value)}
                                            >
                                                <option>USD ($)</option>
                                                <option>EUR (€)</option>
                                                <option>GBP (£)</option>
                                                <option>INR (₹)</option>
                                            </select>
                                        </div>
                                    </div>
                                </SettingsCard>

                                {/* Receipt Config & Preview */}
                                <SettingsCard 
                                    title="Receipt Config" 
                                    subtitle="Customize how your customers see their bill"
                                    icon="receipt_long"
                                >
                                    <div className="flex flex-col md:flex-row gap-8">
                                        <div className="flex-1 space-y-4">
                                            <Toggle 
                                                label="Show Restaurant Logo" 
                                                checked={settings.receipt.showLogo} 
                                                onChange={(v) => updateSetting('receipt', 'showLogo', v)}
                                            />
                                            <Toggle 
                                                label="Enable Payment QR Code" 
                                                checked={settings.receipt.showQR} 
                                                onChange={(v) => updateSetting('receipt', 'showQR', v)}
                                            />
                                            <Toggle 
                                                label="Breakdown Tax Details" 
                                                checked={settings.receipt.showTaxes} 
                                                onChange={(v) => updateSetting('receipt', 'showTaxes', v)}
                                            />
                                            <InputField 
                                                label="Footer Message" 
                                                value={settings.receipt.footerText} 
                                                onChange={(v) => updateSetting('receipt', 'footerText', v)}
                                            />
                                        </div>
                                        {/* Receipt Preview Component */}
                                        <div className="w-full md:w-64 shrink-0 flex flex-col items-center">
                                            <p className="text-[10px] font-bold text-outline uppercase tracking-widest mb-4">Live Preview</p>
                                            <div className="w-full bg-white receipt-shadow rounded-sm p-4 text-[10px] text-gray-800 font-mono border-t-4 border-primary">
                                                {settings.receipt.showLogo && (
                                                    <div className="flex justify-center mb-4">
                                                        <div className="size-8 bg-gray-100 rounded-full flex items-center justify-center text-primary border border-primary/20">
                                                            <span className="material-symbols-outlined text-[16px]">eco</span>
                                                        </div>
                                                    </div>
                                                )}
                                                <p className="text-center font-bold text-[12px] uppercase mb-1">{settings.profile.name}</p>
                                                <p className="text-center opacity-70 mb-4">{settings.profile.phone}</p>
                                                
                                                <div className="border-b border-dashed border-gray-300 mb-2"></div>
                                                <div className="flex justify-between mb-1"><span>Avocado Toast</span><span>$12.00</span></div>
                                                <div className="flex justify-between mb-1"><span>Latte</span><span>$4.50</span></div>
                                                <div className="border-b border-dashed border-gray-300 my-2"></div>
                                                
                                                <div className="flex justify-between font-bold text-[11px]">
                                                    <span>TOTAL</span>
                                                    <span>$16.50</span>
                                                </div>

                                                {settings.receipt.showQR && (
                                                    <div className="mt-6 flex flex-col items-center">
                                                        <div className="size-16 bg-gray-50 border border-gray-200 p-1 mb-1">
                                                            <div className="w-full h-full bg-gray-200"></div>
                                                        </div>
                                                        <p className="text-[8px] opacity-50">Scan to Pay</p>
                                                    </div>
                                                )}

                                                <p className="text-center italic mt-4 px-2">{settings.receipt.footerText}</p>
                                            </div>
                                        </div>
                                    </div>
                                </SettingsCard>

                                {/* Appearance Section */}
                                <SettingsCard 
                                    title="Appearance" 
                                    subtitle="Set the visual mood for your dashboard and POS"
                                    icon="palette"
                                >
                                    <div className="flex flex-wrap gap-4 mb-6">
                                        {['light', 'dark', 'system'].map(mode => (
                                            <button 
                                                key={mode}
                                                onClick={() => updateSetting('appearance', 'theme', mode)}
                                                className={`flex-1 min-w-[100px] p-4 border rounded-xl flex flex-col items-center gap-2 transition-all ${
                                                    settings.appearance.theme === mode 
                                                    ? 'border-primary bg-primary/5 text-primary' 
                                                    : 'border-outline-variant hover:border-outline'
                                                }`}
                                            >
                                                <span className="material-symbols-outlined">
                                                    {mode === 'light' ? 'light_mode' : mode === 'dark' ? 'dark_mode' : 'settings_brightness'}
                                                </span>
                                                <span className="text-xs font-bold capitalize">{mode}</span>
                                            </button>
                                        ))}
                                    </div>
                                    <div>
                                        <p className="text-sm font-medium text-[#131614] mb-3">Brand Accent Color</p>
                                        <div className="flex items-center gap-4">
                                            <input 
                                                type="color" 
                                                value={settings.appearance.primaryColor}
                                                onChange={(e) => updateSetting('appearance', 'primaryColor', e.target.value)}
                                                className="w-12 h-12 rounded-lg cursor-pointer overflow-hidden border-0 p-0"
                                            />
                                            <span className="font-mono text-sm uppercase text-outline">{settings.appearance.primaryColor}</span>
                                        </div>
                                    </div>
                                </SettingsCard>

                                {/* Danger Zone */}
                                <SettingsCard 
                                    title="Danger Zone" 
                                    subtitle="Permanent actions that cannot be undone"
                                    icon="warning"
                                >
                                    <div className="p-4 bg-red-50 border border-red-100 rounded-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                        <div>
                                            <p className="text-sm font-bold text-red-700">Delete Restaurant Account</p>
                                            <p className="text-xs text-red-600/80">Once you delete your account, all data will be permanently removed.</p>
                                        </div>
                                        <button className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg shadow-sm transition-colors">
                                            Request Deletion
                                        </button>
                                    </div>
                                </SettingsCard>
                            </div>
                        </div>
                    </main>

                    {/* Sticky Save Bar */}
                    <AnimatePresence>
                        {isDirty && (
                            <motion.footer 
                                initial={{ y: 100 }}
                                animate={{ y: 0 }}
                                exit={{ y: 100 }}
                                className="fixed bottom-0 left-0 right-0 bg-white border-t border-outline-variant py-4 px-6 lg:px-10 flex items-center justify-between z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]"
                            >
                                <div className="flex items-center gap-3">
                                    <div className="hidden md:flex flex-col">
                                        <p className="text-sm font-bold text-[#131614]">Unsaved Changes</p>
                                        <p className="text-xs text-outline">You have modified your settings.</p>
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button 
                                        onClick={handleDiscard}
                                        className="px-6 py-2.5 rounded-lg text-sm font-bold text-[#131614] hover:bg-gray-100 transition-colors"
                                    >
                                        Discard
                                    </button>
                                    <button 
                                        disabled={isSaving}
                                        onClick={handleSave}
                                        className="min-w-[120px] px-6 py-2.5 bg-primary text-white rounded-lg text-sm font-bold shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                    >
                                        {isSaving ? (
                                            <>
                                                <svg className="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                <span>Saving...</span>
                                            </>
                                        ) : 'Save Changes'}
                                    </button>
                                </div>
                            </motion.footer>
                        )}
                    </AnimatePresence>

                    {/* Toast Notification */}
                    <AnimatePresence>
                        {showToast && (
                            <motion.div 
                                initial={{ opacity: 0, x: 20 }}
                                animate={{ opacity: 1, x: 0 }}
                                exit={{ opacity: 0, x: 20 }}
                                className="fixed top-24 right-6 bg-[#1a1c1a] text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-[60]"
                            >
                                <span className="material-symbols-outlined text-green-400">check_circle</span>
                                <div>
                                    <p className="text-sm font-bold">Settings Updated</p>
                                    <p className="text-xs opacity-70">All changes have been successfully synced.</p>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body></html>
